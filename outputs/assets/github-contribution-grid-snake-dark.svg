<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-labelledby="title desc">
  <title id="title">Contribution snake initialization</title>
  <desc id="desc">Neon contribution grid placeholder shown until GitHub Actions generates the live animation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05030d"/><stop offset="1" stop-color="#16122a"/></linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#a855f7"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <pattern id="cells" width="17" height="17" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="11" height="11" rx="2" fill="#251b45" opacity=".75"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="170" rx="14" fill="url(#bg)"/>
  <rect x="24" y="24" width="852" height="92" fill="url(#cells)"/>
  <path d="M118 65h125c23 0 23 34 0 34h-42c-23 0-23-34 0-34h185c23 0 23 34 0 34h-52" fill="none" stroke="url(#snake)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="118" cy="65" r="8" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="115" cy="62" r="1.8" fill="#05030d"/>
  <text x="450" y="145" text-anchor="middle" fill="#c4b5fd" font-family="Consolas, monospace" font-size="14">SNAKE CORE READY // RUN WORKFLOW TO SYNC LIVE CONTRIBUTIONS</text>
</svg>
