<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Bilgenur Pala — AI and Backend Engineer</title>
  <desc id="desc">Dark cyberpunk banner with a violet grid and neon typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05030d"/>
      <stop offset="0.5" stop-color="#100526"/>
      <stop offset="1" stop-color="#040712"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b5cf6" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <path d="M0 235 L1200 185" stroke="#22d3ee" stroke-opacity="0.2"/>
  <path d="M0 260 L1200 210" stroke="#f472b6" stroke-opacity="0.16"/>
  <circle cx="1030" cy="76" r="112" fill="#8b5cf6" opacity="0.07" filter="url(#glow)"/>
  <circle cx="160" cy="260" r="125" fill="#06b6d4" opacity="0.06" filter="url(#glow)"/>

  <g font-family="Consolas, 'Courier New', monospace">
    <text x="72" y="65" fill="#22d3ee" font-size="18">&gt; SYSTEM.IDENTITY</text>
    <text x="70" y="145" fill="url(#neon)" font-size="55" font-weight="700" letter-spacing="3" filter="url(#glow)">BILGENUR PALA</text>
    <text x="73" y="190" fill="#d8b4fe" font-size="23">AI ENGINEER // BACKEND ENGINEER</text>
    <text x="73" y="235" fill="#94a3b8" font-size="17">RAG SYSTEMS  •  LOCAL AI  •  RELIABLE APIs  •  AGENT WORKFLOWS</text>
    <text x="1000" y="252" fill="#22d3ee" font-size="15">STATUS: ONLINE</text>
  </g>

  <g fill="none" stroke="url(#neon)" stroke-width="2">
    <path d="M24 48V24h24 M1152 24h24v24 M24 252v24h24 M1152 276h24v-24"/>
  </g>
</svg>
