<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-labelledby="title desc">
  <title id="title">Contribution snake initialization</title>
  <desc id="desc">Contribution grid placeholder shown until GitHub Actions generates the live animation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#ede9fe"/></linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0891b2"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
